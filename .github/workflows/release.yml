name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.92
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream build-essential cmake curl desktop-file-utils file jq \
            libfontconfig1-dev \
            libfreetype6-dev libssl-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libxkbcommon-dev patchelf pkg-config

      - name: Validate tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          test "$TAG" = "v$VERSION"
          ./scripts/check.sh

      - name: Generate third-party notices
        run: |
          cargo install --locked --version 0.9.1 --features cli cargo-about
          cargo about generate --locked --fail \
            --output-file THIRD_PARTY_NOTICES.html about.hbs

      - name: Build and verify release packages
        run: |
          ./packaging/build-packages.sh "${GITHUB_REF_NAME#v}"
          ./scripts/verify-packages.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termi-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/*.AppImage dist/*.deb dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "Termi $GITHUB_REF_NAME" \
              dist/*.AppImage dist/*.deb dist/*.tar.gz dist/SHA256SUMS
          fi
