name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.92
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream build-essential cmake desktop-file-utils jq libfontconfig1-dev \
            libfreetype6-dev libssl-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libxkbcommon-dev pkg-config

      - name: Validate source and tests
        run: ./scripts/check.sh

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Smoke-test non-UI commands
        run: |
          ./target/x86_64-unknown-linux-gnu/release/termi --version
          ./target/x86_64-unknown-linux-gnu/release/termi --print-config-path
          XDG_CONFIG_HOME=$(mktemp -d) ./target/x86_64-unknown-linux-gnu/release/termi --check-config
          desktop-file-validate packaging/ai.clairos.termi.desktop

  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.92.0"
          command: check advisories sources
          arguments: --locked
