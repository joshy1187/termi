[package]
name = "termi"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "A native Rust + Slint terminal for Linux"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/joshy1187/termi"
repository = "https://github.com/joshy1187/termi"
keywords = ["linux", "slint", "terminal", "terminal-emulator"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
directories = "6.0"
parking_lot = "0.12"
portable-pty = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
slint = { version = "=1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit-wayland",
    "backend-winit-x11",
    "compat-1-2",
    "image-default-formats",
    "renderer-femtovg",
    "renderer-software",
    "unstable-winit-030",
] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "=0.16.2"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
