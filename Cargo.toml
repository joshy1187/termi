[package]
name = "termi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native Rust + Slint terminal for Linux"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
arboard = "3.6"
directories = "6.0"
parking_lot = "0.12"
portable-pty = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
slint = { version = "=1.17.1", features = ["unstable-winit-030", "image-default-formats"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "=0.16.2"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
