<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Termi application icon</title>
  <desc id="description">A glowing terminal prompt against a galactic blue and violet background.</desc>
  <defs>
    <linearGradient id="space" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08162f"/>
      <stop offset="0.54" stop-color="#17245b"/>
      <stop offset="1" stop-color="#52226f"/>
    </linearGradient>
    <linearGradient id="frame" x1="92" y1="86" x2="421" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62d9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bd69ff" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="prompt" x1="151" y1="191" x2="361" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfbff"/>
      <stop offset="1" stop-color="#bddeff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#space)"/>
  <circle cx="102" cy="107" r="4" fill="#dbf8ff" opacity="0.9"/>
  <circle cx="400" cy="91" r="3" fill="#fff" opacity="0.78"/>
  <circle cx="442" cy="192" r="5" fill="#9be7ff" opacity="0.72"/>
  <circle cx="70" cy="337" r="3" fill="#e8ccff" opacity="0.82"/>
  <circle cx="411" cy="404" r="4" fill="#fff" opacity="0.7"/>
  <path d="M77 199C159 142 202 126 284 139c66 11 103 46 154 77" fill="none" stroke="#755cff" stroke-width="24" stroke-linecap="round" opacity="0.14"/>
  <rect x="76" y="91" width="360" height="330" rx="54" fill="#050b1b" fill-opacity="0.78" stroke="url(#frame)" stroke-width="8"/>
  <path d="M82 157h348" stroke="#7ecfff" stroke-width="5" opacity="0.5"/>
  <circle cx="113" cy="126" r="9" fill="#ff6cae"/>
  <circle cx="143" cy="126" r="9" fill="#ffd36a"/>
  <circle cx="173" cy="126" r="9" fill="#63e6be"/>
  <g fill="none" stroke="url(#prompt)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="m149 216 72 54-72 54" stroke-width="25"/>
    <path d="M250 324h112" stroke-width="25"/>
  </g>
